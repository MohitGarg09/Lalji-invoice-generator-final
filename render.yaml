services:
  - type: web
    name: invoice-generator-backend
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    releaseCommand: python manage.py migrate --noinput
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        sync: false  # Set this in Render dashboard
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        sync: false  # Set this in Render dashboard
      - key: ACCESS_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set this in Render dashboard

